# =============================================================================
#  Configuración de búsqueda — Job Rob
# =============================================================================
#  Todo lo que el usuario puede querer cambiar vive AQUÍ, no en el código:
#  qué se busca, en qué mercados, qué se descarta y cuánto se puede gastar.
#
#  PERFIL DE DEMOSTRACIÓN. El perfil de abajo es FICTICIO: describe a un
#  ejecutivo de operaciones inventado. La versión que usa la clienta real vive
#  solo en su máquina y nunca ha estado en este repositorio.
#
#  Este archivo no contiene secretos: las API keys van en `.env`.
# =============================================================================

version: 1

# Perfil que se ejecuta si no se pasa `--profile`. Es un diccionario para
# poder añadir otra línea de búsqueda sin tocar Python.
active_profile: ejecutivo_operaciones_logistica

profiles:

  ejecutivo_operaciones_logistica:
    label: "Ejecutivo — operaciones, logística y cadena de suministro"
    description: >
      Perfil ficticio de demostración: dirección de operaciones con 15+ años en
      logística, cadena de suministro y manufactura. Volumen esperado bajo:
      decenas de ofertas relevantes al mes, no cientos.

    # Cada combinación es una lista de términos que deben aparecer TODOS en la
    # oferta (semántica AND). Se lanzan contra cada mercado.
    keyword_combinations:
      - ["COO", "Logistics"]
      - ["COO", "Supply Chain"]
      - ["VP Operations", "Logistics"]
      - ["Director of Operations", "Manufacturing"]
      - ["Head of Operations", "Distribution"]
      - ["Logistics Director", "Supply Chain"]
      - ["Plant Director", "Supply Chain"]
      - ["General Manager", "Logistics"]
      - ["Managing Director", "Mexico"]
      - ["Country Manager", "Manufacturing"]
      - ["Supply Chain Director", "Mexico"]
      - ["VP Supply Chain", "Manufacturing"]
      - ["Head of Logistics", "Distribution"]

    markets:
      - alemania
      - mexico
      - texas_us

    # Ajustes por mercado. En México se añaden combinaciones en español y se
    # quitan las que llevan «Mexico» dentro: dentro del índice mexicano esa
    # palabra casa con casi cualquier anuncio del país y solo trae ruido.
    combinaciones_por_mercado:

      mexico:

        ademas:
          - ["Director de Operaciones", "Manufactura"]
          - ["Director de Operaciones", "Logística"]
          - ["Director de Operaciones", "Cadena de Suministro"]
          - ["Director General", "Logística"]
          - ["Director General", "Manufactura"]
          - ["Director de Logística", "Distribución"]
          - ["Director de Cadena de Suministro", "México"]
          - ["Gerente General", "Logística"]
          - ["Director de Planta", "Manufactura"]
          - ["Gerente de Operaciones", "Logística"]

        menos:
          - ["Managing Director", "Mexico"]
          - ["Supply Chain Director", "Mexico"]

    # -------------------------------------------------------------------------
    #  FILTROS DUROS — gratis y locales, antes de gastar un céntimo en el LLM.
    #  `exclude_title_terms` tira roles que no son de dirección (en español,
    #  inglés y alemán); `include_title_terms` es una lista blanca: el título
    #  tiene que decir que el puesto dirige algo. Lo que sobrevive lo lee el
    #  clasificador, que es quien entiende la descripción.
    # -------------------------------------------------------------------------
    hard_filters:

      max_days_old: 30

      exclude_title_terms:

        - "intern"
        - "internship"
        - "becario"
        - "practicante"
        - "prácticas"
        - "trainee"
        - "junior"
        - "jr."
        - "assistant to"
        - "auxiliar"
        - "aprendiz"

        - "praktikant"
        - "praktikantin"
        - "praktikum"
        - "werkstudent"
        - "werkstudentin"
        - "auszubildende"
        - "auszubildender"
        - "azubi"
        - "aushilfe"
        - "sachbearbeiter"
        - "sachbearbeiterin"
        - "assistenz"

        - "analyst"
        - "analista"
        - "associate"
        - "asociado"
        - "specialist"
        - "especialista"
        - "coordinator"
        - "coordinador"
        - "coordinadora"

        - "developer"
        - "desarrollador"
        - "programador"
        - "engineer"
        - "ingeniero"
        - "data scientist"
        - "designer"

        - "business development"
        - "desarrollo de negocio"
        - "account executive"
        - "sales representative"
        - "ejecutivo de ventas"
        - "vendedor"
        - "recruiter"
        - "reclutador"
        - "headhunter"

        - "marketing"
        - "mercadotecnia"
        - "cmo"
        - "publicidad"
        - "brand"
        - "content"
        - "product"
        - "ventas"
        - "sales"
        - "comercial"

        - "finance"
