      include_title_terms:

        - "director"
        - "directora"
        - "dirección"
        - "subdirector"
        - "subdirectora"
        - "gerente"
        - "gerencia"
        - "jefe de"
        - "jefa de"
        - "presidente"
        - "vicepresidente"

        - "chief"
        - "head of"
        - "vp"
        - "vice president"
        - "president"
        - "managing director"
        - "general manager"
        - "country manager"
        - "superintendent"

        - "consultor"
        - "consultora"
        - "consultoría"
        - "consultant"
        - "asesor"
        - "asesora"
        - "asesoría"
        - "advisor"

        - "coo"
        - "ceo"

      exclude_companies: []

      # Umbral salarial. En modo `report` no tira nada: marca en el reporte las
      # ofertas que declaran un sueldo por debajo. Las que no lo declaran se
      # quedan, porque la mayoría de puestos de dirección no lo publica.
      salary_floor:
        mode: report

        amount: 170000
        currency: USD
        period: year

        on_missing_salary: keep

        use_range_top: true

        fx_to_usd:
          USD: 1.0
          MXN: 0.055
          EUR: 1.08
          CAD: 0.73
          GBP: 1.27
        fx_updated: "2026-08-26"

      require_all_terms_in_text: false

# =============================================================================
#  MERCADOS — país, fuente y filtro geográfico local.
#  El filtro geográfico se aplica DESPUÉS de recibir las ofertas: las APIs no
#  filtran por estado o condado de forma fiable, así que se decide aquí.
# =============================================================================
markets:

  alemania:
    label: "Alemania"
    country_code: de

    adzuna:
      country: de
      where: ""

    jooble:
      api_key_env: JOOBLE_API_KEY_US
      host: "de.jooble.org"
      location: "Deutschland"

    geo_filter:
      mode: none

  mexico:
    label: "México"
    country_code: mx

    adzuna:
      country: mx
      where: ""

    jooble:
      api_key_env: JOOBLE_API_KEY_MX
      host: "mx.jooble.org"
      location: "México"

    geo_filter:
      mode: allow_regions

      regions:
        - "Nuevo León"
        - "Coahuila"
        - "Querétaro"
        - "Jalisco"

      cities: []

      unresolved_policy: keep

  texas_us:
    label: "Texas, EE.UU."
    country_code: us

    adzuna:
      country: us
      where: "Texas"

    jooble:
      api_key_env: JOOBLE_API_KEY_US
      host: "jooble.org"
      location: "Texas"

    geo_filter:
      mode: allow_regions

      regions:
        - "texas"
        - "tx"

