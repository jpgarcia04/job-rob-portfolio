# =============================================================================
#  FUENTES — cuotas y ritmo. Jooble da 500 peticiones DE POR VIDA por key, así
#  que lleva su propio contador y se niega a gastar cuando queda poco.
# =============================================================================
sources:

  adzuna:
    enabled: true

    daily_call_budget: 250
    weekly_call_budget: 1000
    monthly_call_budget: 2500

    warn_daily_above: 100

    results_per_page: 50
    max_pages: 1

    max_calls_per_minute: 25
    sleep_seconds_between_calls: 2.5
    timeout_seconds: 30

  jooble:
    enabled: false

    lifetime_request_budget: 500

    warn_when_remaining_below: 100

    refuse_when_remaining_below: 20

    max_pages: 1
    sleep_seconds_between_calls: 1.0
    timeout_seconds: 30

# =============================================================================
#  LLM — los límites de gasto. Cada acción enseña su coste antes de gastar y
#  no puede pasar de `tope_por_accion_usd`. El techo mensual avisa; el tope
#  por acción frena. El triaje decide a qué ofertas merece la pena leerles la
#  descripción completa antes de clasificar.
# =============================================================================
llm:

  tope_por_accion_usd: 0.60

  presupuesto_mensual_usd: 12.00

  al_agotarse: avisar

  racion_automatica_mensual_usd: 10.00

  avisar_al_superar_pct: 75

  esfuerzo_ranking: medium

  max_ofertas_por_ranking: 20

  triaje:
    activo: true

    ofertas_por_corrida: 6

    max_vacantes_por_triaje: 60

    esfuerzo: low

storage:
  database_path: "data/ofertas.db"

cache:
  enabled: true
  directory: "data/cache"
  ttl_hours: 12

descripciones:
  habilitado: true
  max_por_corrida: 40
  sleep_seconds_between_calls: 1.5
  timeout_seconds: 30
